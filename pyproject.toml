[project]
name = "telegram-channels-cleaner"
dynamic = ["version"]
description = "Tinder-like cleanup of your Telegram channel subscriptions, running locally"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite~=0.22.1",
    "alembic~=1.20.1",
    "fastapi~=0.163.1",
    # "fast" = kuricrypt: prebuilt wheels for every platform (tgcrypto needs a C compiler)
    "kurigram[fast]~=2.2.27",
    "pydantic-settings~=2.16.3",
    "sqlalchemy[asyncio]~=2.1.9",
    "uvicorn[standard]~=0.54.0",
]

[project.scripts]
telegram-channels-cleaner = "channels_cleaner.cli:main"

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pyright==1.1.414",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.5.0",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/channels_cleaner/__init__.py"

# The built UI (src/channels_cleaner/static) is gitignored, so it is listed as an artifact:
# build the frontend first (`npm --prefix frontend run build`), then `uv build`.
[tool.hatch.build.targets.sdist]
only-include = ["src/channels_cleaner", "tests", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["src/channels_cleaner/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/channels_cleaner"]
artifacts = ["src/channels_cleaner/static/**"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# Generated by Alembic and reviewed, never edited by hand later
extend-exclude = ["src/channels_cleaner/migrations/versions"]

[tool.ruff.lint]
select = ["ALL"]
# TC: FastAPI and Pydantic read the annotations at runtime, their imports cannot hide in TYPE_CHECKING
ignore = ["D", "ANN201", "CPY001", "COM812", "N818", "RUF001", "RUF002", "RUF003", "TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute everywhere but the re-exports of a package's __init__.py
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["TID252"]
# FastAPI dependencies are declared as call defaults
"src/channels_cleaner/api/*.py" = ["B008"]
# Console output is the CLI's job
"src/channels_cleaner/cli.py" = ["T201"]
# Fake channels: random is the point, the numbers are made-up odds, the 2FA password is published
"src/channels_cleaner/telegram/mock_gateway.py" = ["S311", "PLR2004", "S105"]
# Alembic's env.py: a script in a plain directory, not a module of the package
"src/channels_cleaner/migrations/*" = ["INP001"]
# Tests: the passwords are made up for the mock
"tests/*" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ANN001", "ANN201", "TRY003", "EM101", "EM102", "INP001"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["src/channels_cleaner/static", "src/channels_cleaner/migrations/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
