<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- resizes-content: a phone's keyboard makes the page shorter instead of covering it. Covered, Firefox on Android
         painted only what was above the keyboard and, once it went, left the rest unpainted until a scroll (the
         review's Apply button, changed by typing the 2FA password, stayed blank on a page too short to scroll) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <!-- The browser's own bar in the colour of the header; the ui store follows the theme -->
    <meta name="theme-color" content="#121318" />
    <meta name="apple-mobile-web-app-title" content="Cleaner" />
    <title>Channels Cleaner</title>
  </head>
  <body>
    <div id="app">
      <style>
        #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0e12}
        [data-theme='light'] #splash{background:#f3f4f7}
        #splash i{width:36px;height:36px;border-radius:50%;border:3px solid #2b2e39;border-top-color:#5b8cff;animation:s 0.8s linear infinite}
        @keyframes s{to{transform:rotate(360deg)}}
      </style>
      <div id="splash"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
